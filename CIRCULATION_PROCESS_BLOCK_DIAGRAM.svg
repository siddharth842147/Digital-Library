<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="100%" height="100%">
  <defs>
    <!-- Sharp Black Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <!-- Dotted connection style for actors/roles -->
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #000000; letter-spacing: 0.5px; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #4B5563; }
      .node-text-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #000000; }
      .node-text-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #374151; }
      .edge-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #000000; }
      .role-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #1E293B; }
    </style>
  </defs>

  <!-- Pure White Background -->
  <rect width="1280" height="760" fill="#FFFFFF"/>
  <rect x="15" y="15" width="1250" height="730" fill="none" stroke="#E5E7EB" stroke-width="1.5" rx="8"/>

  <!-- ================= HEADER SECTION ================= -->
  <text x="640" y="52" text-anchor="middle" class="title">DIGITAL LIBRARY CIRCULATION &amp; BORROWING FLOW</text>
  <text x="640" y="74" text-anchor="middle" class="subtitle">Structured Process Block Diagram • Roles, Decisions &amp; Validation Pathways</text>
  <line x1="240" y1="88" x2="1040" y2="88" stroke="#000000" stroke-width="2"/>

  <!-- ================= TOP ROW: BORROWING & ISSUANCE PATHWAY ================= -->

  <!-- 1. Start Circle -->
  <circle cx="75" cy="180" r="40" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <text x="75" y="176" text-anchor="middle" class="node-text-bold">START</text>
  <text x="75" y="192" text-anchor="middle" class="node-text-sub">Patron</text>

  <!-- Role Callout: Student -->
  <rect x="40" y="245" width="70" height="24" rx="12" fill="#F3F4F6" stroke="#000000" stroke-width="1.5"/>
  <text x="75" y="261" text-anchor="middle" class="role-label">Student</text>
  <line x1="75" y1="220" x2="75" y2="245" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Arrow: Start -> Book Request -->
  <line x1="115" y1="180" x2="160" y2="180" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 2. Book Request (Process Rect) -->
  <rect x="160" y="145" width="140" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="230" y="175" text-anchor="middle" class="node-text-bold">Book Request</text>
  <text x="230" y="195" text-anchor="middle" class="node-text-sub">Select title from catalog</text>

  <!-- Arrow: Book Request -> Check Stock -->
  <line x1="300" y1="180" x2="350" y2="180" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 3. Check Stock (Process Rect) -->
  <rect x="350" y="145" width="140" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="420" y="175" text-anchor="middle" class="node-text-bold">Check Stock</text>
  <text x="420" y="195" text-anchor="middle" class="node-text-sub">Query available copies</text>

  <!-- Arrow: Check Stock -> Decision 1 (In Stock?) -->
  <line x1="490" y1="180" x2="540" y2="180" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 4. Decision Diamond 1: In Stock? -->
  <polygon points="610,130 680,180 610,230 540,180" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <text x="610" y="178" text-anchor="middle" class="node-text-bold">In Stock?</text>
  <text x="610" y="194" text-anchor="middle" class="node-text-sub">Copies &gt; 0</text>

  <!-- Role Callout: System Engine -->
  <rect x="565" y="90" width="90" height="24" rx="12" fill="#F3F4F6" stroke="#000000" stroke-width="1.5"/>
  <text x="610" y="106" text-anchor="middle" class="role-label">System Engine</text>
  <line x1="610" y1="114" x2="610" y2="130" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Branch: In Stock = NO -> Waitlist / Reserve -->
  <path d="M 610 130 L 610 100 L 730 100" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="625" y="87" width="80" height="22" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="665" y="102" text-anchor="middle" class="edge-label">Out of Stock</text>

  <rect x="730" y="65" width="150" height="68" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="805" y="95" text-anchor="middle" class="node-text-bold">Waitlist / Reserve</text>
  <text x="805" y="115" text-anchor="middle" class="node-text-sub">Hold copy on restock</text>

  <!-- Waitlist Terminal End -->
  <line x1="880" y1="99" x2="930" y2="99" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="965" cy="99" r="35" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="965" y="95" text-anchor="middle" class="node-text-bold">END</text>
  <text x="965" y="110" text-anchor="middle" class="node-text-sub">Waitlisted</text>

  <!-- Branch: In Stock = YES -> Scan Digital QR -->
  <line x1="680" y1="180" x2="740" y2="180" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="687" y="167" width="46" height="22" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="710" y="182" text-anchor="middle" class="edge-label">In Stock</text>

  <!-- 5. Scan Digital QR (Process Rect) -->
  <rect x="740" y="145" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="815" y="175" text-anchor="middle" class="node-text-bold">Scan Digital QR</text>
  <text x="815" y="195" text-anchor="middle" class="node-text-sub">Optical camera checkout</text>

  <!-- Role Callout: Librarian -->
  <rect x="775" y="235" width="80" height="24" rx="12" fill="#F3F4F6" stroke="#000000" stroke-width="1.5"/>
  <text x="815" y="251" text-anchor="middle" class="role-label">Librarian</text>
  <line x1="815" y1="215" x2="815" y2="235" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Arrow: Scan Digital QR -> Decision 2 (Student Valid?) -->
  <line x1="890" y1="180" x2="940" y2="180" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 6. Decision Diamond 2: Student Valid? -->
  <polygon points="1010,130 1080,180 1010,230 940,180" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <text x="1010" y="175" text-anchor="middle" class="node-text-bold">Student Valid?</text>
  <text x="1010" y="192" text-anchor="middle" class="node-text-sub">Active, Fines=0, Quota&lt;3</text>

  <!-- Branch: Student Valid = NO -> Reject / Blocked -->
  <path d="M 1010 130 L 1010 100 L 1100 100" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1025" y="87" width="55" height="22" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="1052" y="102" text-anchor="middle" class="edge-label">Invalid</text>

  <rect x="1100" y="70" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="1165" y="96" text-anchor="middle" class="node-text-bold">Reject Request</text>
  <text x="1165" y="114" text-anchor="middle" class="node-text-sub">Access blocked / Cancel</text>

  <!-- Branch: Student Valid = YES -> Issue Book -->
  <path d="M 1010 230 L 1010 300 L 1080 300" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1025" y="287" width="45" height="22" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="1047" y="302" text-anchor="middle" class="edge-label">Valid</text>

  <!-- 7. Issue Book (Process Rect) -->
  <rect x="1080" y="265" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="1155" y="295" text-anchor="middle" class="node-text-bold">Issue Book</text>
  <text x="1155" y="315" text-anchor="middle" class="node-text-sub">14-Day loan &amp; stock -1</text>


  <!-- ================= CONNECTOR: LOAN PERIOD TRANSITION ================= -->
  <!-- Down and left pathway from Issue Book to Return Cycle -->
  <path d="M 1155 335 L 1155 410 L 1050 410" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 8. Active Loan Period (Center-Right Rect) -->
  <rect x="880" y="375" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="965" y="405" text-anchor="middle" class="node-text-bold">Active Loan Period</text>
  <text x="965" y="425" text-anchor="middle" class="node-text-sub">14 Days reading / holding</text>

  <!-- Arrow: Active Loan -> Student Returns Book -->
  <line x1="880" y1="410" x2="800" y2="410" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 9. Student Returns Book (Desk Trigger Rect) -->
  <rect x="630" y="375" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="715" y="405" text-anchor="middle" class="node-text-bold">Book Return Desk</text>
  <text x="715" y="425" text-anchor="middle" class="node-text-sub">Student hands in physical book</text>


  <!-- ================= BOTTOM ROW: RETURN & SETTLEMENT PATHWAY ================= -->

  <!-- Pathway: Return Desk -> Decision 3 (Overdue Fine?) -->
  <path d="M 715 445 L 715 560 L 760 560" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 10. Decision Diamond 3: Overdue Fine? -->
  <polygon points="830,510 900,560 830,610 760,560" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <text x="830" y="555" text-anchor="middle" class="node-text-bold">Fine Due?</text>
  <text x="830" y="572" text-anchor="middle" class="node-text-sub">Excl. Sundays/Holidays</text>

  <!-- Branch: Fine Due = YES -> Payment Settlement -->
  <line x1="900" y1="560" x2="970" y2="560" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="910" y="547" width="50" height="22" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="935" y="562" text-anchor="middle" class="edge-label">Fine &gt; 0</text>

  <!-- 11. Payment Gateway / Counter Settlement (Process Rect) -->
  <rect x="970" y="525" width="165" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="1052" y="555" text-anchor="middle" class="node-text-bold">Payment Settlement</text>
  <text x="1052" y="575" text-anchor="middle" class="node-text-sub">Cash at Desk or Razorpay</text>

  <!-- Role Callout: Payment Gateway -->
  <rect x="1000" y="615" width="110" height="24" rx="12" fill="#F3F4F6" stroke="#000000" stroke-width="1.5"/>
  <text x="1055" y="631" text-anchor="middle" class="role-label">Payment Gateway</text>
  <line x1="1052" y1="595" x2="1052" y2="615" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- From Payment Settlement -> Merge into Restock -->
  <path d="M 1052 525 L 1052 485 L 535 485 L 535 525" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="740" y="473" width="95" height="22" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="787" y="488" text-anchor="middle" class="edge-label">Fine Settled</text>

  <!-- Branch: Fine Due = NO -> Restock Inventory -->
  <line x1="760" y1="560" x2="600" y2="560" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="660" y="547" width="55" height="22" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="687" y="562" text-anchor="middle" class="edge-label">No Fine</text>

  <!-- 12. Restock Inventory (Process Rect) -->
  <rect x="440" y="525" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="520" y="555" text-anchor="middle" class="node-text-bold">Restock Inventory</text>
  <text x="520" y="575" text-anchor="middle" class="node-text-sub">Available copies +1</text>

  <!-- Arrow: Restock -> Return Complete -->
  <line x1="440" y1="560" x2="350" y2="560" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 13. Return Complete (Receipt &amp; Record Close) -->
  <rect x="180" y="525" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="265" y="555" text-anchor="middle" class="node-text-bold">Return Complete</text>
  <text x="265" y="575" text-anchor="middle" class="node-text-sub">Receipt generated &amp; closed</text>

  <!-- Arrow: Return Complete -> Terminal End Circle -->
  <line x1="180" y1="560" x2="115" y2="560" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 14. Terminal End Circle -->
  <circle cx="75" cy="560" r="40" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <circle cx="75" cy="560" r="32" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="75" y="556" text-anchor="middle" class="node-text-bold">END</text>
  <text x="75" y="572" text-anchor="middle" class="node-text-sub">Circulation</text>

  <!-- ================= SYSTEM INTEGRITY NOTE / LEGEND ================= -->
  <g transform="translate(60, 665)">
    <rect x="0" y="0" width="1160" height="45" rx="6" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="20" y="27" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#111827">SHAPES LEGEND:</text>
    
    <circle cx="160" cy="22" r="10" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="178" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#374151">Terminals (Start / End)</text>

    <rect x="330" y="12" width="22" height="20" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="360" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#374151">Process Execution Blocks</text>

    <polygon points="535,12 547,22 535,32 523,22" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="555" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#374151">Decision Diamonds (Branching)</text>

    <line x1="755" y1="22" x2="795" y2="22" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="805" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#374151">Directed Sequence Flow</text>

    <rect x="960" y="13" width="45" height="18" rx="9" fill="#F3F4F6" stroke="#000000" stroke-width="1.2"/>
    <text x="1015" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#374151">Authorized Role / Actor</text>
  </g>
</svg>
