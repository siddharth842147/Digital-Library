<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 820" width="100%" height="100%">
  <defs>
    <!-- Sharp Black Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000"/>
    </marker>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 23px; font-weight: 800; fill: #000000; letter-spacing: 0.5px; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #4B5563; }
      .node-text-bold { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #000000; }
      .node-text-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #374151; }
      .badge-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: 800; fill: #FFFFFF; letter-spacing: 0.3px; }
      .role-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #1E293B; }
      .info-badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #111827; }
    </style>
  </defs>

  <!-- Pure White Background with subtle outer border -->
  <rect width="1320" height="820" fill="#FFFFFF"/>
  <rect x="15" y="15" width="1290" height="790" fill="none" stroke="#E5E7EB" stroke-width="1.5" rx="8"/>

  <!-- ================= HEADER SECTION ================= -->
  <text x="660" y="44" text-anchor="middle" class="title">DIGITAL LIBRARY CIRCULATION &amp; BORROWING FLOW</text>
  <text x="660" y="66" text-anchor="middle" class="subtitle">Complete Standard Process Block Diagram • Roles, Decisions (YES / NO Branches) &amp; Execution States</text>
  <line x1="320" y1="78" x2="1000" y2="78" stroke="#000000" stroke-width="1.8"/>

  <!-- ================= TOP BRANCH: WAITLIST & REJECT TERMINALS ================= -->

  <!-- Decision 1 Branch: NO [Stock = 0] -> Waitlist / Reserve -->
  <path d="M 575 190 L 575 130 L 685 130" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="585" y="118" width="90" height="24" rx="5" fill="#000000"/>
  <text x="630" y="135" text-anchor="middle" class="badge-text">NO (Stock=0)</text>

  <rect x="685" y="100" width="145" height="60" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="757" y="127" text-anchor="middle" class="node-text-bold">Waitlist / Reserve</text>
  <text x="757" y="145" text-anchor="middle" class="node-text-sub">Hold copy on return</text>

  <!-- Waitlist Terminal End Circle -->
  <line x1="830" y1="130" x2="870" y2="130" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="900" cy="130" r="28" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="900" y="126" text-anchor="middle" class="node-text-bold">END</text>
  <text x="900" y="141" text-anchor="middle" class="node-text-sub">Waitlisted</text>

  <!-- Decision 2 Branch: NO [Invalid] -> Reject Request -->
  <path d="M 1005 190 L 1005 130 L 1090 130" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1012" y="118" width="85" height="24" rx="5" fill="#000000"/>
  <text x="1054" y="135" text-anchor="middle" class="badge-text">NO (Invalid)</text>

  <rect x="1090" y="100" width="135" height="60" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="1157" y="127" text-anchor="middle" class="node-text-bold">Reject Request</text>
  <text x="1157" y="145" text-anchor="middle" class="node-text-sub">Fines due or quota max</text>

  <!-- Reject Terminal End Circle -->
  <line x1="1225" y1="130" x2="1255" y2="130" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="1282" cy="130" r="25" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="1282" y="126" text-anchor="middle" class="node-text-bold">END</text>
  <text x="1282" y="140" text-anchor="middle" class="node-text-sub">Blocked</text>


  <!-- ================= ROW 1: BORROWING & ISSUANCE PATHWAY ================= -->

  <!-- 1. Start Circle Terminal -->
  <circle cx="70" cy="240" r="38" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <text x="70" y="236" text-anchor="middle" class="node-text-bold">START</text>
  <text x="70" y="252" text-anchor="middle" class="node-text-sub">Patron</text>

  <!-- Role Callout: Student -->
  <rect x="35" y="302" width="70" height="24" rx="12" fill="#F3F4F6" stroke="#000000" stroke-width="1.5"/>
  <text x="70" y="318" text-anchor="middle" class="role-label">Student</text>
  <line x1="70" y1="278" x2="70" y2="302" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Arrow: Start -> Book Request -->
  <line x1="108" y1="240" x2="150" y2="240" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 2. Book Request (Process Rect) -->
  <rect x="150" y="205" width="135" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="217" y="235" text-anchor="middle" class="node-text-bold">Book Request</text>
  <text x="217" y="255" text-anchor="middle" class="node-text-sub">Select title from catalog</text>

  <!-- Arrow: Book Request -> Check Stock -->
  <line x1="285" y1="240" x2="330" y2="240" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 3. Check Stock (Process Rect) -->
  <rect x="330" y="205" width="135" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="397" y="235" text-anchor="middle" class="node-text-bold">Check Stock</text>
  <text x="397" y="255" text-anchor="middle" class="node-text-sub">Query available copies</text>

  <!-- Arrow: Check Stock -> Decision 1 (In Stock?) -->
  <line x1="465" y1="240" x2="515" y2="240" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 4. Decision Diamond 1: In Stock? -->
  <polygon points="575,190 635,240 575,290 515,240" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <text x="575" y="237" text-anchor="middle" class="node-text-bold">In Stock?</text>
  <text x="575" y="253" text-anchor="middle" class="node-text-sub">Copies &gt; 0</text>

  <!-- Role Callout: System Engine -->
  <rect x="525" y="305" width="100" height="24" rx="12" fill="#F3F4F6" stroke="#000000" stroke-width="1.5"/>
  <text x="575" y="321" text-anchor="middle" class="role-label">System Engine</text>
  <line x1="575" y1="290" x2="575" y2="305" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Decision 1 Branch: YES [In stock] -> Scan Digital QR -->
  <line x1="635" y1="240" x2="740" y2="240" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="657" y="228" width="65" height="24" rx="5" fill="#000000"/>
  <text x="689" y="245" text-anchor="middle" class="badge-text">YES</text>

  <!-- 5. Scan Digital QR (Process Rect) -->
  <rect x="740" y="205" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="815" y="235" text-anchor="middle" class="node-text-bold">Scan Digital QR</text>
  <text x="815" y="255" text-anchor="middle" class="node-text-sub">Optical camera checkout</text>

  <!-- Role Callout: Librarian -->
  <rect x="775" y="302" width="80" height="24" rx="12" fill="#F3F4F6" stroke="#000000" stroke-width="1.5"/>
  <text x="815" y="318" text-anchor="middle" class="role-label">Librarian</text>
  <line x1="815" y1="275" x2="815" y2="302" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Arrow: Scan Digital QR -> Decision 2 (Student Valid?) -->
  <line x1="890" y1="240" x2="945" y2="240" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 6. Decision Diamond 2: Student Valid? -->
  <polygon points="1005,190 1065,240 1005,290 945,240" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <text x="1005" y="235" text-anchor="middle" class="node-text-bold">Student Valid?</text>
  <text x="1005" y="252" text-anchor="middle" class="node-text-sub">Fine=₹0, Quota&lt;3</text>

  <!-- Decision 2 Branch: YES [Valid] -> Issue Book -->
  <path d="M 1065 240 L 1150 240 L 1150 315" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1075" y="228" width="76" height="24" rx="5" fill="#000000"/>
  <text x="1113" y="245" text-anchor="middle" class="badge-text">YES (Valid)</text>

  <!-- 7. Issue Book (Process Rect) -->
  <rect x="1065" y="315" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="1150" y="345" text-anchor="middle" class="node-text-bold">Issue Book</text>
  <text x="1150" y="365" text-anchor="middle" class="node-text-sub">14-Day loan &amp; stock -1</text>


  <!-- ================= ROW 2: ACTIVE LOAN & BOOK RETURN DESK ================= -->
  
  <!-- From Issue Book down to Active Loan Period -->
  <path d="M 1150 385 L 1150 435 L 1065 435" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 8. Active Loan Period (Process Rect) -->
  <rect x="895" y="400" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="980" y="430" text-anchor="middle" class="node-text-bold">Active Loan Period</text>
  <text x="980" y="450" text-anchor="middle" class="node-text-sub">14 Days reading / holding</text>

  <!-- Arrow: Active Loan -> Book Return Desk -->
  <line x1="895" y1="435" x2="815" y2="435" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 9. Student Returns Book (Desk Trigger Rect) -->
  <rect x="645" y="400" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="730" y="430" text-anchor="middle" class="node-text-bold">Book Return Desk</text>
  <text x="730" y="450" text-anchor="middle" class="node-text-sub">Patron hands in physical book</text>

  <!-- Role Callout: Circulation Desk -->
  <rect x="680" y="360" width="100" height="22" rx="11" fill="#F3F4F6" stroke="#000000" stroke-width="1.5"/>
  <text x="730" y="375" text-anchor="middle" class="role-label">Circulation Desk</text>
  <line x1="730" y1="382" x2="730" y2="400" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>


  <!-- ================= ROW 3: OVERDUE DECISION & INVENTORY RESTOCK ================= -->

  <!-- Pathway: Return Desk -> Decision 3 Top Vertex (Clean downward entry) -->
  <path d="M 730 470 L 730 515 L 840 515 L 840 540" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 10. Decision Diamond 3: Fine Due? -->
  <polygon points="840,540 905,590 840,640 775,590" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <text x="840" y="585" text-anchor="middle" class="node-text-bold">Fine Due?</text>
  <text x="840" y="603" text-anchor="middle" class="node-text-sub">Excl. Sun/Holidays</text>

  <!-- Decision 3 Branch: YES [Fine > 0] -> Payment Settlement (Exits Right) -->
  <line x1="905" y1="590" x2="1000" y2="590" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="912" y="578" width="95" height="24" rx="5" fill="#000000"/>
  <text x="959" y="595" text-anchor="middle" class="badge-text">YES (Fine &gt; 0)</text>

  <!-- 11. Payment Settlement (Process Rect) -->
  <rect x="1000" y="555" width="165" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="1082" y="585" text-anchor="middle" class="node-text-bold">Payment Settlement</text>
  <text x="1082" y="605" text-anchor="middle" class="node-text-sub">Counter Cash or Razorpay</text>

  <!-- Role Callout: Payment Gateway -->
  <rect x="1030" y="645" width="105" height="24" rx="12" fill="#F3F4F6" stroke="#000000" stroke-width="1.5"/>
  <text x="1082" y="661" text-anchor="middle" class="role-label">Payment Gateway</text>
  <line x1="1082" y1="625" x2="1082" y2="645" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- From Payment Settlement -> Clean upper bypass back into Restock Inventory -->
  <path d="M 1082 555 L 1082 485 L 535 485 L 535 555" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="755" y="473" width="115" height="24" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="812" y="489" text-anchor="middle" class="info-badge">✓ Fine Settled</text>

  <!-- Decision 3 Branch: NO [Zero Fine] -> Restock Inventory (Exits Left) -->
  <line x1="775" y1="590" x2="615" y2="590" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="650" y="578" width="95" height="24" rx="5" fill="#000000"/>
  <text x="697" y="595" text-anchor="middle" class="badge-text">NO (Zero Fine)</text>

  <!-- 12. Restock Inventory (Process Rect) -->
  <rect x="455" y="555" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="535" y="585" text-anchor="middle" class="node-text-bold">Restock Inventory</text>
  <text x="535" y="605" text-anchor="middle" class="node-text-sub">Available copies +1</text>

  <!-- Arrow: Restock -> Return Complete -->
  <line x1="455" y1="590" x2="365" y2="590" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 13. Return Complete (Receipt & Record Close) -->
  <rect x="195" y="555" width="170" height="70" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
  <text x="280" y="585" text-anchor="middle" class="node-text-bold">Return Complete</text>
  <text x="280" y="605" text-anchor="middle" class="node-text-sub">Receipt generated &amp; closed</text>

  <!-- Arrow: Return Complete -> Terminal End Circle -->
  <line x1="195" y1="590" x2="115" y2="590" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 14. Terminal End Circle (Double Circle for Final State) -->
  <circle cx="70" cy="590" r="38" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>
  <circle cx="70" cy="590" r="30" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="70" y="586" text-anchor="middle" class="node-text-bold">END</text>
  <text x="70" y="602" text-anchor="middle" class="node-text-sub">Circulation</text>


  <!-- ================= SYSTEM INTEGRITY NOTE / SHAPES LEGEND ================= -->
  <g transform="translate(45, 740)">
    <rect x="0" y="0" width="1230" height="52" rx="6" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="25" y="31" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" font-weight="700" fill="#111827">SHAPES LEGEND:</text>
    
    <!-- Circle Terminal -->
    <circle cx="165" cy="26" r="11" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="185" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" fill="#374151">Terminals (Start / End)</text>

    <!-- Rectangle Process -->
    <rect x="345" y="15" width="22" height="22" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="375" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" fill="#374151">Process Execution Blocks</text>

    <!-- Diamond Decision -->
    <polygon points="555,15 567,26 555,37 543,26" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="575" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" fill="#374151">Decision Diamonds (YES / NO Branches)</text>

    <!-- Flow Arrow -->
    <line x1="835" y1="26" x2="875" y2="26" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="885" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" fill="#374151">Directed Sequence Flow</text>

    <!-- Role Pill -->
    <rect x="1045" y="16" width="45" height="20" rx="10" fill="#F3F4F6" stroke="#000000" stroke-width="1.2"/>
    <text x="1100" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5px" fill="#374151">Authorized Role / Actor</text>
  </g>
</svg>
